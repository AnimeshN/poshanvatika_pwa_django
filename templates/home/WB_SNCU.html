{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>West Bengal SNCU GIS Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="{% static 'static1/leaflet.css' %}">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        .header {
            min-height: 30px;
            background-color: #004d40;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 2px -2px gray;
        }

        #map {
            height: calc(100vh - 50px);
            width: 100%;
        }

        .sncu-popup {
            min-width: 220px;
            max-width: 350px;
            max-height: 300px;
            overflow-y: auto;
            font-family: Arial, sans-serif;
        }

        .sncu-popup h3 {
            background: #004d40;
            color: white;
            padding: 8px;
            margin: 0 0 8px 0;
            font-size: 15px;
        }

        .sncu-popup table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
        }

        .sncu-popup th,
        .sncu-popup td {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .sncu-popup th {
            background: #f2f2f2;
            width: 42%;
        }

        .map-status {
            position: absolute;
            z-index: 1000;
            top: 65px;
            right: 10px;
            max-width: 240px;
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 5px #777;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .header {
                height: auto;
                padding: 10px 5px;
                font-size: 16px;
            }

            #map {
                height: calc(100vh - 45px);
            }

            .map-status {
                top: 75px;
                max-width: 180px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        West Bengal SNCU GIS MAP
    </div>

    <div id="map"></div>

    <div id="mapStatus" class="map-status">
        Loading map layers...
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
    // =========================================================
    // 1. CONFIGURATION
    // =========================================================

    const GEOSERVER =
        'https://geonode.communitygis.in/geoserver';

    // Keep the workspace-specific WMS endpoint.
    const WMS_URL =
        GEOSERVER + '/geonode/wms';

    // Use the standard GeoServer WFS endpoint.
    const WFS_URL =
        GEOSERVER + '/ows';

    const STATE_LAYER_NAME = 'wb_state';
    const STATE_STYLE_NAME = 'wb_state';

    const SNCU_LAYER_NAME = 'wb_pincode_withsncu_v1';
    const SNCU_STYLE_NAME = 'wb_pincode_withsncu_v1';

    const statusElement = document.getElementById('mapStatus');

    function setStatus(message) {
        statusElement.textContent = message;
    }


    // =========================================================
    // 2. INITIALIZE MAP
    // =========================================================

    const map = L.map('map');

    function setMapView() {
        const zoomLevel =
            window.innerWidth <= 600 ? 7 : 9;

        map.setView([23.2726, 87.6639], zoomLevel);
    }

    setMapView();


    // =========================================================
    // 3. GOOGLE HYBRID BASEMAP
    // =========================================================

    const satelliteLayer = L.tileLayer(
        'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',
        {
            maxZoom: 19,
            attribution: '&copy; Google'
        }
    ).addTo(map);


    // =========================================================
    // 4. WMS STATE BOUNDARY
    // =========================================================

    const wmsState = L.tileLayer.wms(WMS_URL, {
        layers: STATE_LAYER_NAME,
        styles: STATE_STYLE_NAME,
        format: 'image/png',
        transparent: true,
        version: '1.1.1',
        opacity: 1
    }).addTo(map);


    // =========================================================
    // 5. WMS SNCU PINCODE BOUNDARIES
    // =========================================================

    const wmsSNCU = L.tileLayer.wms(WMS_URL, {
        layers: SNCU_LAYER_NAME,
        styles: SNCU_STYLE_NAME,
        format: 'image/png',
        transparent: true,
        version: '1.1.1',
        opacity: 1
    }).addTo(map);


    // =========================================================
    // 6. LAYER CONTROLS
    // =========================================================

    L.control.layers(
        {
            'Google Hybrid Satellite': satelliteLayer
        },
        {
            'West Bengal State Boundary': wmsState,
            'SNCU Pincode Boundaries': wmsSNCU
        },
        {
            collapsed: window.innerWidth <= 600
        }
    ).addTo(map);


    // =========================================================
    // 7. WFS CONFIGURATION
    // =========================================================

    let sncuFeatureType = null;
    let hoverRequestController = null;
    let hoverTimer = null;
    let lastHoverKey = '';
    let activeHighlight = null;

    // The hover query uses a small geographic bounding box.
    // The returned polygons are then checked against the exact
    // mouse position before showing a popup.
    const HOVER_RADIUS = 0.015;

    const highlightStyle = {
        color: '#ff3300',
        weight: 3,
        opacity: 1,
        fillColor: '#ffff00',
        fillOpacity: 0.20
    };


    // =========================================================
    // 8. HTML ESCAPING
    // =========================================================

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }


    // =========================================================
    // 9. WFS GETCAPABILITIES
    //    DISCOVER THE REAL PUBLISHED FEATURE TYPE
    // =========================================================

    async function discoverSNCUFeatureType() {
        const params = new URLSearchParams({
            service: 'WFS',
            version: '2.0.0',
            request: 'GetCapabilities'
        });

        const response = await fetch(
            WFS_URL + '?' + params.toString()
        );

        if (!response.ok) {
            throw new Error(
                'WFS GetCapabilities HTTP error: ' +
                response.status
            );
        }

        const xmlText = await response.text();

        if (
            xmlText.trim().startsWith('<!DOCTYPE html') ||
            xmlText.trim().startsWith('<html')
        ) {
            throw new Error(
                'WFS returned HTML instead of XML. Check the WFS endpoint.'
            );
        }

        const xml = new DOMParser().parseFromString(
            xmlText,
            'application/xml'
        );

        if (xml.querySelector('parsererror')) {
            throw new Error(
                'Unable to parse WFS GetCapabilities XML.'
            );
        }

        const exception = xml.querySelector(
            'Exception, ServiceException'
        );

        if (exception) {
            throw new Error(
                exception.textContent || 'GeoServer WFS error'
            );
        }

        const featureElements = Array.from(
            xml.getElementsByTagNameNS('*', 'FeatureType')
        );

        const featureTypes = featureElements
            .map(function (element) {
                const nameElement =
                    element.getElementsByTagNameNS('*', 'Name')[0];

                const titleElement =
                    element.getElementsByTagNameNS('*', 'Title')[0];

                return {
                    name: nameElement
                        ? nameElement.textContent.trim()
                        : '',
                    title: titleElement
                        ? titleElement.textContent.trim()
                        : ''
                };
            })
            .filter(function (feature) {
                return feature.name.length > 0;
            });

        console.log('Published WFS feature types:', featureTypes);

        // First, look for an exact match ignoring case.
        let match = featureTypes.find(function (feature) {
            return feature.name.toLowerCase() ===
                SNCU_LAYER_NAME.toLowerCase();
        });

        // If the published feature type has a namespace prefix,
        // compare the part after the colon as well.
        if (!match) {
            match = featureTypes.find(function (feature) {
                const localName = feature.name
                    .split(':')
                    .pop()
                    .toLowerCase();

                return localName ===
                    SNCU_LAYER_NAME.toLowerCase();
            });
        }

        // Finally, find a likely SNCU/pincode layer by name or title.
        if (!match) {
            match = featureTypes.find(function (feature) {
                const text = (
                    feature.name + ' ' + feature.title
                ).toLowerCase();

                return text.includes('pincode') &&
                    text.includes('sncu');
            });
        }

        if (!match) {
            console.error(
                'Available WFS feature types:',
                featureTypes
            );

            throw new Error(
                'Could not find the SNCU pincode feature type. ' +
                'See the browser console for published feature names.'
            );
        }

        sncuFeatureType = match.name;

        console.log(
            'Selected SNCU WFS feature type:',
            sncuFeatureType
        );

        setStatus(
            'Map ready. Hover over an SNCU pincode boundary to view attributes.'
        );
    }

    // =========================================================
// WEST BENGAL BOUNDARY — GEOJSON OUTLINE ONLY
// =========================================================

let stateOutlineLayer = null;

async function loadWestBengalOutline() {
    const params = new URLSearchParams({
        service: 'WFS',
        version: '2.0.0',
        request: 'GetFeature',
        typeNames: STATE_LAYER_NAME,
        outputFormat: 'application/json',
        srsName: 'EPSG:4326'
    });

    const response = await fetch(
        WFS_URL + '?' + params.toString()
    );

    if (!response.ok) {
        throw new Error(
            'State boundary WFS request failed: ' +
            response.status
        );
    }

    const text = await response.text();

    if (text.trim().startsWith('<')) {
        console.error('State boundary response:', text);
        throw new Error(
            'GeoServer returned XML instead of GeoJSON. ' +
            'Check the state WFS feature type.'
        );
    }

    const geojson = JSON.parse(text);

    if (!geojson.features || geojson.features.length === 0) {
        throw new Error('No state boundary features returned.');
    }

    // Remove the filled WMS state layer so it cannot obscure
    // the satellite basemap.
    if (map.hasLayer(wmsState)) {
        map.removeLayer(wmsState);
    }

    // Draw boundary only: no fill.
    if (stateOutlineLayer) {
        map.removeLayer(stateOutlineLayer);
    }

    stateOutlineLayer = L.geoJSON(geojson, {
        interactive: false,

        style: {
            color: '#00FFFF',
            weight: 3,
            opacity: 1,
            fill: false,
            fillOpacity: 0
        }
    }).addTo(map);

    console.log('West Bengal outline loaded successfully.');
}
    // =========================================================
    // 10. POINT-IN-POLYGON TEST
    //     CHECK THAT THE POINTER IS INSIDE A FEATURE
    // =========================================================

    function pointOnSegment(point, a, b) {
        const x = point[0];
        const y = point[1];

        const x1 = a[0];
        const y1 = a[1];

        const x2 = b[0];
        const y2 = b[1];

        const cross =
            (x - x1) * (y2 - y1) -
            (y - y1) * (x2 - x1);

        if (Math.abs(cross) > 1e-10) {
            return false;
        }

        return (
            x >= Math.min(x1, x2) - 1e-10 &&
            x <= Math.max(x1, x2) + 1e-10 &&
            y >= Math.min(y1, y2) - 1e-10 &&
            y <= Math.max(y1, y2) + 1e-10
        );
    }

    function pointInRing(point, ring) {
        let inside = false;

        for (
            let i = 0, j = ring.length - 1;
            i < ring.length;
            j = i++
        ) {
            const a = ring[j];
            const b = ring[i];

            if (pointOnSegment(point, a, b)) {
                return true;
            }

            const intersects =
                ((b[1] > point[1]) !==
                 (a[1] > point[1])) &&
                (
                    point[0] <
                    (a[0] - b[0]) *
                    (point[1] - b[1]) /
                    ((a[1] - b[1]) || 1e-20) +
                    b[0]
                );

            if (intersects) {
                inside = !inside;
            }
        }

        return inside;
    }

    function pointInPolygonCoordinates(point, rings) {
        if (!rings || rings.length === 0) {
            return false;
        }

        // First ring is the exterior boundary.
        if (!pointInRing(point, rings[0])) {
            return false;
        }

        // Subsequent rings are holes.
        for (let i = 1; i < rings.length; i++) {
            if (pointInRing(point, rings[i])) {
                return false;
            }
        }

        return true;
    }

    function pointInGeometry(point, geometry) {
        if (!geometry) {
            return false;
        }

        const coordinates = geometry.coordinates;

        switch (geometry.type) {
            case 'Polygon':
                return pointInPolygonCoordinates(
                    point,
                    coordinates
                );

            case 'MultiPolygon':
                return coordinates.some(function (polygon) {
                    return pointInPolygonCoordinates(
                        point,
                        polygon
                    );
                });

            case 'GeometryCollection':
                return (geometry.geometries || []).some(
                    function (childGeometry) {
                        return pointInGeometry(
                            point,
                            childGeometry
                        );
                    }
                );

            default:
                return false;
        }
    }


    // =========================================================
    // 11. POPUP SHOWING ALL FEATURE ATTRIBUTES
    // =========================================================

    function createFeaturePopup(feature) {
        const properties = feature.properties || {};

        let rows = '';

        Object.keys(properties).forEach(function (key) {
            const value = properties[key];

            if (
                value === null ||
                value === undefined ||
                value === ''
            ) {
                return;
            }

            rows +=
                '<tr>' +
                    '<th>' + escapeHtml(key) + '</th>' +
                    '<td>' + escapeHtml(value) + '</td>' +
                '</tr>';
        });

        if (!rows) {
            rows =
                '<tr><td colspan="2">No attributes available</td></tr>';
        }

        return (
            '<div class="sncu-popup">' +
                '<h3>SNCU Pincode Information</h3>' +
                '<table>' + rows + '</table>' +
            '</div>'
        );
    }


    // =========================================================
    // 12. WFS GETFEATURE ON HOVER
    // =========================================================

    async function getFeatureAtPoint(latlng) {
        if (!sncuFeatureType) {
            return;
        }

        // Cancel the previous request if the pointer moves.
        if (hoverRequestController) {
            hoverRequestController.abort();
        }

        hoverRequestController = new AbortController();

        const controller = hoverRequestController;

        const minLon = latlng.lng - HOVER_RADIUS;
        const minLat = latlng.lat - HOVER_RADIUS;
        const maxLon = latlng.lng + HOVER_RADIUS;
        const maxLat = latlng.lat + HOVER_RADIUS;

        const params = new URLSearchParams({
            service: 'WFS',
            version: '2.0.0',
            request: 'GetFeature',
            typeNames: sncuFeatureType,
            outputFormat: 'application/json',
            srsName: 'EPSG:4326',
            count: '30',
            bbox: [
                minLon,
                minLat,
                maxLon,
                maxLat,
                'EPSG:4326'
            ].join(',')
        });

        const requestUrl =
            WFS_URL + '?' + params.toString();

        try {
            const response = await fetch(requestUrl, {
                signal: controller.signal
            });

            if (!response.ok) {
                throw new Error(
                    'WFS GetFeature HTTP error: ' +
                    response.status
                );
            }

            const responseText = await response.text();

            // GeoServer may return XML for an exception even
            // when the request was expected to return GeoJSON.
            if (
                responseText.trim().startsWith('<') &&
                !responseText.trim().startsWith('{')
            ) {
                console.error(
                    'WFS returned XML/HTML instead of GeoJSON:',
                    responseText.substring(0, 1000)
                );

                throw new Error(
                    'WFS returned an exception instead of GeoJSON.'
                );
            }

            const geojson = JSON.parse(responseText);

            if (!geojson.features) {
                console.warn(
                    'WFS response contains no features:',
                    geojson
                );

                return;
            }

            const point = [
                latlng.lng,
                latlng.lat
            ];

            // BBOX retrieves nearby candidates. Check each candidate's
            // actual polygon before showing its attributes.
            const feature = geojson.features.find(
                function (candidate) {
                    return pointInGeometry(
                        point,
                        candidate.geometry
                    );
                }
            );

            if (!feature) {
                if (activeHighlight) {
                    map.removeLayer(activeHighlight);
                    activeHighlight = null;
                }

                return;
            }

            // Remove the previous highlight.
            if (activeHighlight) {
                map.removeLayer(activeHighlight);
            }

            // Highlight the selected feature without replacing
            // the original WMS layers.
            activeHighlight = L.geoJSON(feature, {
                style: highlightStyle,
                interactive: false
            }).addTo(map);

            // Display all non-empty feature attributes.
            L.popup({
                maxWidth: 380,
                maxHeight: 350,
                autoPan: true
            })
                .setLatLng(latlng)
                .setContent(createFeaturePopup(feature))
                .openOn(map);

        } catch (error) {
            if (error.name === 'AbortError') {
                return;
            }

            console.error('WFS hover error:', error);
            setStatus(
                'WFS error. Check the browser console.'
            );
        }
    }


    // =========================================================
    // 13. HOVER EVENT
    // =========================================================

    map.on('mousemove', function (event) {
        if (!sncuFeatureType) {
            return;
        }

        // Avoid repeating the same request at almost identical points.
        const key = [
            event.latlng.lat.toFixed(4),
            event.latlng.lng.toFixed(4)
        ].join(',');

        if (key === lastHoverKey) {
            return;
        }

        lastHoverKey = key;

        if (hoverTimer) {
            clearTimeout(hoverTimer);
        }

        // Throttle requests while the pointer moves.
        hoverTimer = setTimeout(function () {
            getFeatureAtPoint(event.latlng);
        }, 350);
    });


    // Close the hover popup and remove the highlight when leaving
    // the map. The WMS boundary layers remain visible.
    map.on('mouseout', function () {
        if (hoverTimer) {
            clearTimeout(hoverTimer);
        }

        if (hoverRequestController) {
            hoverRequestController.abort();
        }

        lastHoverKey = '';

        map.closePopup();

        if (activeHighlight) {
            map.removeLayer(activeHighlight);
            activeHighlight = null;
        }
    });


    // =========================================================
    // 14. INITIALIZE WFS
    // =========================================================

    discoverSNCUFeatureType()
        .then(function () {
            console.log(
                'West Bengal SNCU map initialized with WMS boundaries ' +
                'and WFS hover information.'
            );
        })
        .catch(function (error) {
            console.error(
                'Could not initialize SNCU WFS:',
                error
            );

            setStatus(
                'WMS map loaded; WFS hover unavailable. ' +
                'Check the browser console.'
            );
        });

    </script>

</body>
</html>
